name: Build APK and AAR

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Make gradlew executable
        run: chmod +x gradlew
        
      - name: Build APK (Debug)
        run: ./gradlew assembleDebug
        
      - name: Build APK (Release)
        run: ./gradlew assembleRelease
        
      - name: Build AAR (Debug)
        run: ./gradlew :binderceptor:assembleDebug
        
      - name: Build AAR (Release)
        run: ./gradlew :binderceptor:assembleRelease
        
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          
      - name: Upload Debug AAR
        uses: actions/upload-artifact@v4
        with:
          name: binderceptor-debug
          path: binderceptor/build/outputs/aar/*.aar
          
      - name: Upload Release AAR
        uses: actions/upload-artifact@v4
        with:
          name: binderceptor-release
          path: binderceptor/build/outputs/aar/*.aar
